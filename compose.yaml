services:
  watcher:
    image: ghcr.io/landlord7284/fii-docs-watcher:${IMAGE_TAG:-latest}
    restart: unless-stopped
    init: true
    env_file: .env
    volumes:
      - ./config.toml:/config/config.toml:ro
      - fii-data:/data
      - ${DOCUMENTS_PATH:-./documents}:/documents
    stop_grace_period: 180s
volumes:
  fii-data:
