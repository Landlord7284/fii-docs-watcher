[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fii-docs-watcher"
version = "0.7.0"
description = "Downloads Brazilian real-estate fund (FII) documents from Fundos.NET into a sliding N-day archive"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "ruamel.yaml>=0.18",
    # `clock` resolves a zone at import time, so an absent IANA database is a
    # crash before any error handling runs. `zoneinfo` prefers the system
    # database and falls back to this wheel, which makes the package work on a
    # minimal Linux image that ships none.
    "tzdata>=2024.1",
]

[project.scripts]
fii-docs-watcher = "fii_docs_watcher.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]

# `manifest/db.py` reads schema.sql at runtime, so it has to be in the wheel.
# Current setuptools includes it anyway, since include-package-data defaults to
# true for a pyproject-configured project -- this states the requirement rather
# than relying on that default, because the failure it would cause is a
# FileNotFoundError on first connect, only ever seen in a built install.
[tool.setuptools.package-data]
fii_docs_watcher = ["**/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: hits the real Fundos.NET / CVM sources; deselected by default",
]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 100
# `docker` holds the container's scheduling driver, which imports the package
# and is linted with it even though it is packaging rather than part of it.
src = ["src", "tests", "docker"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Tests unpack whole fixtures for readability and nest `with` blocks to keep the
# assertion visibly inside the context being tested. Neither is worth contorting.
"tests/**" = ["RUF059", "SIM117"]
