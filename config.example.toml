# fii-docs-watcher configuration.
#
# Every value here except [source].timezone can be overridden by an environment
# variable named FII_WATCHER_<SECTION>_<KEY>, e.g. FII_WATCHER_PATHS_DATA_ROOT.
# No path, CNPJ or personal preference is ever compiled into the code.

[paths]
# Private robot state: funds.yaml, manifest.sqlite, watcher.lock, cvm-cache/.
# MUST live on a filesystem local to the process. SQLite over SMB/NFS has
# unreliable locking and durability.
data_root = "./var/data"

# The shareable archive: date directories, _inbox/ and .tmp/.
# This is the only root that should ever be exported over SMB.
documents_root = "./var/documents"

[retention]
# Number of dates kept, including today. first_retained_date = today - (N - 1).
# The same frontier drives purge, the query window and the _inbox index.
days = 7

[discovery]
# How many dates each of the two run profiles asks the source about. Both end
# on today, and neither changes what the archive keeps -- purge, the index and
# the frontier stay on [retention].days whichever profile ran.
#
# `days` is what `run` sweeps. Unset it and it follows [retention].days. It may 
# never exceed retention: a sweep wider than the window rediscovers what 
# purge has already deleted, so it is refused rather than trimmed.
days = 7

# `monitor_days` is the window of `run --monitor` -- the frequent profile,
# which reads the source's listing newest-first, stops at what it has already
# accounted for, queries per entity only the funds that actually filed, and
# skips the global audit. 
monitor_days = 2

[source]
base_url = "https://fnet.bmfbovespa.com.br/fnet/publico"

# The timezone the source publishes in. `dataEntrega` arrives on the wire with
# no offset, so this is what "today" means for the archive: directory names, the
# retention frontier, the query window, the _inbox filename and the watermark
# all derive from it. It is never read from the host, so a container in UTC
# produces byte-identical output to a laptop in Sao Paulo.
#
# The default is correct for Fundos.NET and there is no reason to change it in
# normal use.
# This is the one key with no environment override: it is the project's single
# declaration of a zone, and setting FII_WATCHER_SOURCE_TIMEZONE is an error
# rather than a second place to name it.
timezone = "America/Sao_Paulo"

# Identifiable, as courtesy to a public endpoint we do not own.
user_agent = "fii-docs-watcher/0.2 (+https://github.com/Landlord7284/fii-docs-watcher)"

# Successful responses from this host are bimodally distributed: they return in
# ~0.3s or in ~60.3s, with nothing in between. A conventional 30s timeout fails
# roughly half of all requests. Do not lower this without re-measuring.
read_timeout_seconds = 120.0
connect_timeout_seconds = 15.0

# Verified ceiling: l=200 is honoured, l>=250 returns HTTP 500. The endpoint
# never truncates silently, so exceeding this fails loudly rather than quietly.
page_length = 200

# Courtesy pause between requests, and retry policy for a source with no SLA.
min_request_interval_seconds = 1.5
max_retries = 3
backoff_base_seconds = 2.0
backoff_max_seconds = 30.0

# Refuse to buffer a response larger than this (bytes).
max_response_bytes = 104857600

[cvm]
# The RCVM 175 registry. One daily ZIP containing registro_fundo.csv,
# registro_classe.csv and registro_subclasse.csv (latin-1, ';' delimited).
registry_url = "https://dados.cvm.gov.br/dados/FI/CAD/DADOS/registro_fundo_classe.zip"

# Re-download the snapshot only if the cached one is older than this.
# Failure to refresh never stops monitoring: already-resolved scopes keep
# running on the last valid snapshot.
refresh_interval_hours = 24
read_timeout_seconds = 180.0

# Refuse to buffer a registry response larger than this (bytes).
max_response_bytes = 104857600

[audit]
# The global-listing cross-check (detective only, never a discovery path).
# "daily", "weekly" or "never".
frequency = "daily"

[download]
# Which content formats to keep. `downloadDocumento` serves PDF and XML from the
# same endpoint; only the PDF is kept by default. both:  formats = ["pdf", "xml"]
#
# Documents declined this way are recorded in the manifest as `skipped`, not
# lost: widening this list later picks them up on the next run, without needing
# to rediscover them.
formats = ["pdf"]

# Remove orphaned .part files older than this during startup reconciliation.
stale_part_hours = 6

[files]
# Creation modes for the shared archive.
directory_mode = 0o755
file_mode = 0o644

[logging]
# "DEBUG", "INFO", "WARNING", "ERROR", "CRITICAL"
level = "INFO"

# "text" or "json"
format = "text"

# Optional. Logs go to stdout/stderr by default and require no log directory.
# file = "./var/watcher.log"
