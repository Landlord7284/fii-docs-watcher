[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fii-docs-watcher"
version = "0.1.0"
description = "Downloads Brazilian real-estate fund (FII) documents from Fundos.NET into a sliding N-day archive"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "ruamel.yaml>=0.18",
]

[project.scripts]
fii-docs-watcher = "fii_docs_watcher.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: hits the real Fundos.NET / CVM sources; deselected by default",
]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Tests unpack whole fixtures for readability and nest `with` blocks to keep the
# assertion visibly inside the context being tested. Neither is worth contorting.
"tests/**" = ["RUF059", "SIM117"]
